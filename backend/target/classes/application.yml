# 智教思政后端服务配置文件
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: smart-education-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_education?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.smartedu.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: SmartEducationSecretKey2024VeryLongSecretKeyForJwtSigning
  expiration: 86400

# AI 服务配置
ai:
  # 对话默认入口，前端“默认”按钮将命中该配置
  proxy:
    enabled: false
    label: ${AI_PROXY_LABEL:default-proxy}
    api-key: ${AI_PROXY_API_KEY:}
    base-url: ${AI_PROXY_API_BASE:https://codex.miaomiaocode.com/v1}
    model: ${AI_PROXY_MODEL:gpt-5-codex-mini}
    timeout: 120

  # 后台任务自动回退顺序与熔断阈值
  routing:
    default-chat-provider: ${AI_DEFAULT_CHAT_PROVIDER:openai}
    # 后台链路：逗号分隔，按顺序尝试，未 enabled 的节点会自动跳过。
    # 默认只启用 openai 一个节点，保持与现有行为一致；接上额外节点时在此追加即可。
    background-chain: ${AI_BACKGROUND_CHAIN:openai}
    failure-threshold: ${AI_FAILURE_THRESHOLD:3}
    # 熔断冷却秒数：达到阈值后经过该时长允许一次半开探活，避免需重启后端才恢复。
    circuit-cool-down-seconds: ${AI_CIRCUIT_COOL_DOWN_SECONDS:60}

  routes:
    chat: ${AI_ROUTE_CHAT:openai}
    parse: ${AI_ROUTE_PARSE:openai}
    ideology: ${AI_ROUTE_IDEOLOGY:openai}
    question-gen: ${AI_ROUTE_QUESTION_GEN:openai}
    crawl: ${AI_ROUTE_CRAWL:openai}
    path: ${AI_ROUTE_PATH:openai}

  pipeline:
    max-input-chars: ${AI_PIPELINE_MAX_INPUT_CHARS:5000}
    max-knowledge-points: ${AI_PIPELINE_MAX_KNOWLEDGE_POINTS:12}
    max-ideology-matches-per-point: ${AI_PIPELINE_MAX_IDEOLOGY_MATCHES_PER_POINT:3}
    max-questions: ${AI_PIPELINE_MAX_QUESTIONS:6}
    schema-version: ${AI_PIPELINE_SCHEMA_VERSION:v1}
    regenerate-retry: ${AI_PIPELINE_REGENERATE_RETRY:1}

  # 原有 DeepSeek 配置保留，可作为后台自动回退节点
  deepseek:
    enabled: ${DEEPSEEK_ENABLED:false}
    api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
    base-url: ${DEEPSEEK_API_BASE:https://api.deepseek.com/v1}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    timeout: 120

  # 本地 OpenAI 兼容接口作为当前默认聊天入口
  openai:
    enabled: ${OPENAI_ENABLED:true}
    label: ${OPENAI_LABEL:openai}
    api-key: ${OPENAI_API_KEY:your-api-key-1}
    base-url: ${OPENAI_API_BASE:http://localhost:8317/v1}
    model: ${OPENAI_MODEL:gpt-5.4}
    timeout: 120

  # Gemini 仍为预留配置，当前默认关闭
  gemini:
    enabled: ${GEMINI_ENABLED:false}
    api-key: ${GEMINI_API_KEY:}
    base-url: ${GEMINI_API_BASE:https://generativelanguage.googleapis.com/v1beta}
    model: ${GEMINI_MODEL:}
    timeout: 120

  # Phase 3A: embedding model config (reuses openai-compatible provider base-url when provider=openai)
  embedding:
    enabled: ${EMBEDDING_ENABLED:false}
    provider: ${EMBEDDING_PROVIDER:openai}
    model: ${EMBEDDING_MODEL:text-embedding-3-small}
    dimensions: ${EMBEDDING_DIMENSIONS:1536}
    api-key: ${EMBEDDING_API_KEY:}
    base-url: ${EMBEDDING_BASE_URL:}
    timeout: 30

mineru:
  # 以 MinerU 为文档解析首选入口；enabled=false 或 api-key 缺失时整条链路自动回退到本地 POI/PDFBox 抽取。
  enabled: ${MINERU_ENABLED:true}
  # MinerU token 只从 MINERU_API_KEY 环境变量读取，避免把疑似真实密钥固化到仓库。
  api-key: ${MINERU_API_KEY:}
  base-url: ${MINERU_API_BASE:https://mineru.net/api/v4}
  model-version: ${MINERU_MODEL_VERSION:vlm}
  language: ${MINERU_LANGUAGE:ch}
  enable-formula: ${MINERU_ENABLE_FORMULA:true}
  enable-table: ${MINERU_ENABLE_TABLE:true}
  is-ocr: ${MINERU_IS_OCR:false}
  # 单次解析整体超时（秒），覆盖申请-上传-轮询-下载全流程。
  timeout: ${MINERU_TIMEOUT:300}
  # 单 HTTP 请求超时（秒）。
  http-timeout: ${MINERU_HTTP_TIMEOUT:60}
  # MinerU zip 解压后图片/附件的本地存放目录；前端通过 asset-url-prefix 静态访问。
  assets-path: ${MINERU_ASSETS_PATH:./uploads/mineru-assets}
  asset-url-prefix: ${MINERU_ASSET_URL_PREFIX:/api/upload/mineru-assets}

# Phase 3A: Qdrant vector search layer
qdrant:
  enabled: ${QDRANT_ENABLED:false}
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6333}
  # Collection names used by the semantic search service
  collection-knowledge-points: knowledge_points
  collection-ideology-matches: ideology_matches
  collection-selection-explain: selection_explain

storage:
  upload-path: ./uploads
  allowed-types: pdf,doc,docx,ppt,pptx,xls,xlsx,md,markdown

logging:
  level:
    root: INFO
    com.smartedu: DEBUG
    com.baomidou.mybatisplus: DEBUG
