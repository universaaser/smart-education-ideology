# 智教思政后端服务配置文件
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: smart-education-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_education?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.smartedu.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: SmartEducationSecretKey2024VeryLongSecretKeyForJwtSigning
  expiration: 86400

# AI 服务配置
ai:
  # 对话默认入口，前端“默认”按钮将命中该配置
  proxy:
    enabled: true
    label: ${AI_PROXY_LABEL:default-proxy}
    api-key: ${AI_PROXY_API_KEY:codex_fdc40f2667d778e09fc46906389afa1d031c4ce07d8a3ca8}
    base-url: ${AI_PROXY_API_BASE:https://codex.miaomiaocode.com/v1}
    model: ${AI_PROXY_MODEL:gpt-5-codex-mini}
    timeout: 120

  # 后台任务自动回退顺序与熔断阈值
  routing:
    default-chat-provider: ${AI_DEFAULT_CHAT_PROVIDER:proxy}
    background-providers: ${AI_BACKGROUND_PROVIDERS:proxy,deepseek,openai}
    failure-threshold: ${AI_FAILURE_THRESHOLD:3}

  pipeline:
    max-input-chars: ${AI_PIPELINE_MAX_INPUT_CHARS:5000}
    max-knowledge-points: ${AI_PIPELINE_MAX_KNOWLEDGE_POINTS:12}
    max-ideology-matches-per-point: ${AI_PIPELINE_MAX_IDEOLOGY_MATCHES_PER_POINT:3}
    max-questions: ${AI_PIPELINE_MAX_QUESTIONS:6}
    schema-version: ${AI_PIPELINE_SCHEMA_VERSION:v1}
    regenerate-retry: ${AI_PIPELINE_REGENERATE_RETRY:1}

  # 原有 DeepSeek 配置保留，可作为后台自动回退节点
  deepseek:
    enabled: ${DEEPSEEK_ENABLED:true}
    api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
    base-url: ${DEEPSEEK_API_BASE:https://api.deepseek.com/v1}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    timeout: 120

  # 原有 OpenAI 兼容配置保留，默认关闭，按需开启
  openai:
    enabled: ${OPENAI_ENABLED:false}
    label: ${OPENAI_LABEL:openai}
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_API_BASE:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    timeout: 120

  # Gemini 仍为预留配置，当前默认关闭
  gemini:
    enabled: ${GEMINI_ENABLED:false}
    api-key: ${GEMINI_API_KEY:}
    base-url: ${GEMINI_API_BASE:https://generativelanguage.googleapis.com/v1beta}
    model: ${GEMINI_MODEL:}
    timeout: 120

mineru:
  api-key: ${MINERU_API_KEY:your-mineru-api-key}
  base-url: ${MINERU_API_BASE:https://api.mineru.ai/v1}
  timeout: 300

storage:
  upload-path: ./uploads
  allowed-types: pdf,doc,docx,ppt,pptx,xls,xlsx

logging:
  level:
    root: INFO
    com.smartedu: DEBUG
    com.baomidou.mybatisplus: DEBUG
