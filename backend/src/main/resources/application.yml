# 智教思政后端服务配置文件
# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /

# Spring 配置
spring:
  application:
    name: smart-education-backend

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # NOTE: 请根据实际情况修改数据库连接信息
    url: jdbc:mysql://localhost:3306/smart_education?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # Jackson 日期格式配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.smartedu.entity
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    # 控制台打印 SQL（生产环境建议关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键自增策略
      id-type: auto
      # 逻辑删除配置
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  # NOTE: 生产环境请使用更复杂的密钥
  secret: SmartEducationSecretKey2024VeryLongSecretKeyForJwtSigning
  # 令牌有效期（单位：秒，默认 24 小时）
  expiration: 86400

# AI 服务配置
ai:
  # DeepSeek API 配置
  deepseek:
    # NOTE: 请在此填入您的 API Key
    api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
    base-url: https://api.deepseek.com/v1
    model: deepseek-chat
    # 请求超时时间（秒）
    timeout: 120

  # 预留其他 AI 提供商配置
  gemini:
    api-key: ${GEMINI_API_KEY:your-gemini-api-key}
    base-url: https://generativelanguage.googleapis.com/v1beta

  # OpenAI 兼容 API 配置（用于统一接入）
  openai:
    provider: ${OPENAI_PROVIDER:openai}
    api-key: ${OPENAI_API_KEY:codex666}
    base-url: ${OPENAI_API_BASE:https://load.frp.helpus.dpdns.org:18080/proxy/codex/v1}
    model: ${OPENAI_MODEL:gpt-5.3-codex}
    timeout: 120

  # 当前使用的 AI 提供商
  provider: ${AI_PROVIDER:openai}

# MinerU 文档解析服务配置
mineru:
  # NOTE: 请在此填入您的 API Key
  api-key: ${MINERU_API_KEY:your-mineru-api-key}
  base-url: https://api.mineru.ai/v1
  # 请求超时时间（秒）
  timeout: 300

# 文件存储配置
storage:
  # 上传文件存储路径
  upload-path: ./uploads
  # 允许的文件类型
  allowed-types: pdf,doc,docx,ppt,pptx,xls,xlsx

# 日志配置
logging:
  level:
    root: INFO
    com.smartedu: DEBUG
    com.baomidou.mybatisplus: DEBUG
